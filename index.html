<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>CORNDEVs | Personal Tech Knowledge Base</title>
    <script src="assets/theme.js"></script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital,wght@0,400;1,400&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1" rel="stylesheet"/>
    <link href="assets/theme.css" rel="stylesheet"/>
    <script src="assets/tailwind-config.js"></script>
    <script src="assets/site-header.js"></script>
    <style>
        body {
            background-color: hsl(var(--background));
            color: hsl(var(--foreground));
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth;
        }
        .label-text {
            font-family: 'Space Grotesk', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--scrollbar-track);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--scrollbar-thumb-hover);
        }

        /* Liquid Glass Effect */
        .liquid-glass {
            background: rgba(255, 255, 255, 0.01);
            background-blend-mode: luminosity;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: none;
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }
        .liquid-glass::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1.4px;
            background: linear-gradient(180deg,
                rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.15) 20%,
                rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%,
                rgba(255,255,255,0.15) 80%, rgba(255,255,255,0.45) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        /* Animations */
        @keyframes fade-rise {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-rise { animation: fade-rise 0.8s ease-out both; }
        .animate-fade-rise-delay { animation: fade-rise 0.8s ease-out 0.2s both; }
        .animate-fade-rise-delay-2 { animation: fade-rise 0.8s ease-out 0.4s both; }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased">
    <!-- Header -->
    <div id="site-header" data-active="home"></div>
    <script>
        SiteHeader.init({
            active: 'home',
            position: 'fixed',
            extra: '<a href="knowledge.html" class="liquid-glass rounded-full px-6 py-2.5 text-sm text-foreground hover:scale-[1.03] transition-all duration-300 inline-block">Begin Journey</a>'
        });
    </script>

    <main class="flex-grow">
        <!-- Hero Section -->
        <section id="hero" class="relative w-full h-screen overflow-hidden flex flex-col justify-center items-center text-center px-6">
            <!-- Video Background -->
            <video autoplay loop muted playsinline class="absolute inset-0 w-full h-full object-cover z-0">
                <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260314_131748_f2ca2a28-fed7-44c8-b9a9-bd9acdd5ec31.mp4" type="video/mp4">
            </video>

            <!-- Overlay for contrast and transition -->
            <div class="absolute inset-0 bg-gradient-to-b from-black/60 via-black/25 to-[#002742] z-0"></div>

            <!-- Content -->
            <div class="relative z-10 flex flex-col items-center justify-center max-w-5xl mx-auto px-6">
                <!-- Title -->
                <h1 style="font-family: 'Instrument Serif', serif;" class="animate-fade-rise text-5xl sm:text-7xl md:text-8xl leading-[0.95] tracking-[-2.46px] font-normal text-white">
                    Where <em class="not-italic text-white/60">dreams</em> rise <br class="hidden md:inline" />
                    <em class="not-italic text-white/60">through the silence.</em>
                </h1>

                <!-- Subtext -->
                <p class="animate-fade-rise-delay text-white/60 text-base sm:text-lg max-w-2xl mt-8 leading-relaxed">
                    Nơi chia sẻ kiến thức chuyên sâu về công nghệ và lập trình. Giữa thế giới số không ngừng chuyển động, chúng tôi tạo dựng không gian tĩnh lặng cho tư duy đột phá và những dòng code truyền cảm hứng.
                </p>

                <!-- Hero CTA Button -->
                <a href="knowledge.html" class="animate-fade-rise-delay-2 liquid-glass rounded-full px-14 py-5 text-base text-white mt-12 hover:scale-[1.03] transition-all duration-300 cursor-pointer inline-block">
                    Begin Journey
                </a>
            </div>
        </section>
    </main>
</body>
</html>
