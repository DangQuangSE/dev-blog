<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Bài tập | CORNDEVs</title>
    <script src="assets/theme.js"></script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital,wght@0,400;1,400&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1"
      rel="stylesheet"
    />
    <link href="assets/theme.css" rel="stylesheet" />
    <link href="assets/ambient-reveal.css" rel="stylesheet" />
    <script src="assets/ambient-reveal.js"></script>
    <script src="assets/tailwind-config.js"></script>
    <script src="assets/site-header.js"></script>
    <style>
      body {
        background-color: hsl(var(--background));
        color: hsl(var(--foreground));
        font-family: "Inter", sans-serif;
        scroll-behavior: smooth;
      }
      .technical-border {
        border: 1px solid var(--outline-variant);
      }
      .technical-border-hover:hover {
        border-color: var(--heading-accent);
        transition: border-color 0.3s ease;
      }
      .label-text {
        font-family: "Space Grotesk", sans-serif;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--scrollbar-track);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--scrollbar-thumb);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--scrollbar-thumb-hover);
      }
    </style>
  </head>
  <body class="min-h-screen flex flex-col antialiased">
    <div id="ambient-bg"></div>

    <!-- Header -->
    <div id="site-header" data-active="exercises"></div>
    <script>
      SiteHeader.init({
        active: 'exercises',
        extra: '<a href="index.html" class="text-sm font-medium text-muted-foreground hover:text-foreground transition-colors flex items-center gap-1"><span class="material-symbols-outlined !text-sm">arrow_back</span> Về trang chủ</a>'
      });
    </script>

    <main class="flex-grow py-24 px-6">
      <div class="max-w-5xl mx-auto space-y-12">
        <div class="space-y-3" data-reveal-up>
          <span class="label-text text-primary-container text-[10px] font-bold">Thực hành</span>
          <h1 class="text-3xl font-bold text-foreground">Bài tập</h1>
          <p class="text-muted-foreground text-sm max-w-2xl">
            Các bài tập luyện tập — khác với mục "Kiến thức" (lý thuyết thuần) hay "Dự án" (build log), đây là đề bài
            có đáp án và giải thích chi tiết.
          </p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8" data-reveal-up>
          <!-- Topic groups are added here as tiles, one block per topic, e.g.:
          <div class="space-y-6">
            <div class="flex items-center justify-between border-b border-outline-variant pb-4">
              <h2 class="text-2xl font-bold text-on-surface">DSA</h2>
              <span class="material-symbols-outlined text-primary-container">terminal</span>
            </div>
            <div class="grid grid-cols-1 gap-4">
              <a
                href="posts.html?category=exercise-dsa&name=DSA"
                class="technical-border technical-border-hover p-4 rounded-lg glass-card group"
              >
                <span class="label-text text-[10px] text-on-surface-variant group-hover:text-primary-container">01</span>
                <h3 class="font-bold text-on-surface mt-1">Bài tập cấu trúc dữ liệu & giải thuật</h3>
                <p class="text-xs text-muted-foreground mt-2">N bài: đề + đáp án + giải thích.</p>
              </a>
            </div>
          </div>
          -->
          <div class="col-span-full text-center py-16 text-muted-foreground text-sm">
            Chưa có bài tập nào — sắp ra mắt.
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
